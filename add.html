<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нове оголошення</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Оголошення</a>
      <nav class="nav" aria-label="Головна навігація">
        <ul>
          <li><a href="index.html">Стрічка</a></li>
          <li><a href="add.html" aria-current="page">Додати</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Нове оголошення</h1>
    <form class="form-box" method="post" action="/">
      <label for="title">Заголовок</label>
      <input id="title"  type="text" placeholder="Заголовок" required>
      <label for="category">Категорія</label>
      <select id="category" name="category">
        <option value="навчання">навчання</option>
        <option value="події">події</option>
        <option value="адмін">адмін</option>
      </select>
      <label for="text">Текст</label>
      <textarea id="text" name="text" rows="5" placeholder="Текст оголошення" required></textarea>
      <div class="actions"><button class="btn" type="submit">Опублікувати</button></div>
    </form>
  </main>

  <footer class="site-footer">
    <p>© Кафедра інформаційних технологій · Дошка оголошень</p>
  </footer>
</body>
</html>
